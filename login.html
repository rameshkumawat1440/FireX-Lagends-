<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIREX LEGENDS</title><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
width:100vw;
height:100vh;
overflow:hidden;

background:url("assets/file_000000002bfc71f7adca8cd91588e1eb.png");
background-size:cover;
background-position:center;
background-repeat:no-repeat;

display:flex;
flex-direction:column;
justify-content:flex-end;
}

/* Dark overlay */

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.15);
}

/* Login area */

.login-area{
position:relative;
z-index:2;

width:100%;

padding:20px;

display:flex;
flex-direction:column;
gap:12px;

margin-bottom:15px;
}

/* Buttons */

.login-btn{

width:92%;

max-width:500px;

margin:auto;

height:58px;

border:none;

border-radius:16px;

font-size:18px;

font-weight:bold;

cursor:pointer;

display:flex;
align-items:center;
justify-content:center;

gap:10px;

backdrop-filter:blur(8px);

box-shadow:0 4px 15px rgba(0,0,0,0.4);
}

.guest{
background:rgba(255,255,255,0.95);
color:black;
}

.google{
background:rgba(255,255,255,0.95);
color:black;
}

.facebook{
background:rgba(24,119,242,0.95);
color:white;
}

/* Version */

.version{
position:relative;
z-index:2;

text-align:center;

color:white;

font-size:12px;

margin-bottom:10px;

text-shadow:0 0 5px black;
}

</style></head><body><div class="overlay"></div><div class="login-area"><button class="login-btn guest"
onclick="guestLogin()">
🎮 Guest Login
</button>

<button class="login-btn google">
🔵 Google Login
</button><button class="login-btn facebook">
📘 Facebook Login
</button></div><div class="version">
FIREX LEGENDS • Version 0.1
</div><script>

function guestLogin(){

localStorage.setItem(
"playerName",
"Guest"
);

window.location="character.html";

}

</script></body>
</html>
