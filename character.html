<!DOCTYPE html>
<html>
<head>
<title>Character</title>
<style>
body{
background:black;
color:white;
font-family:Arial;
text-align:center;
}
button{
width:150px;
height:50px;
margin:10px;
}
input{
height:40px;
width:250px;
font-size:18px;
}
</style>
</head>
<body>

<h1>Create Character</h1>

<input
id="name"
placeholder="Enter Name">

<br><br>

<button onclick="male()">
Male
</button>

<button onclick="female()">
Female
</button>

<script>

function male(){

save("Male");

}

function female(){

save("Female");

}

function save(gender){

let player={

uid:"FXL"+
Math.floor(
10000000+
Math.random()*90000000
),

name:
document.getElementById(
"name"
).value,

gender:gender,

level:1,

coins:1000,

emeralds:0,

hp:200,

ep:100

};

localStorage.setItem(
"player",
JSON.stringify(player)
);

window.location=
"lobby.html";

}

</script>

</body>
</html>
