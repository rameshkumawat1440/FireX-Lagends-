<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Character</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
width:100vw;
height:100vh;
overflow:hidden;

background:url("assets/file_00000000c5a4723088116824305750c9.png");
background-size:cover;
background-position:center;
background-repeat:no-repeat;

display:flex;
justify-content:center;
align-items:center;
}

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
}

.container{
position:relative;
z-index:2;
text-align:center;
width:90%;
max-width:700px;
}

.title{
font-size:50px;
font-weight:bold;
color:white;
margin-bottom:30px;
text-shadow:0 0 20px red;
}

.name-box{
width:100%;
max-width:450px;
height:60px;

border:none;
outline:none;

padding-left:20px;

font-size:22px;
font-weight:bold;

border-radius:15px;

background:rgba(255,255,255,0.12);
backdrop-filter:blur(10px);

color:white;

border:2px solid rgba(255,255,255,0.3);
}

.name-box::placeholder{
color:#ddd;
}

.gender-area{
display:flex;
justify-content:center;
gap:25px;
margin-top:40px;
}

.gender-card{

width:180px;
height:200px;

border:2px solid rgba(255,255,255,0.3);

border-radius:20px;

background:rgba(255,255,255,0.08);

display:flex;
flex-direction:column;

justify-content:center;
align-items:center;

cursor:pointer;

transition:0.3s;
}

.gender-card:hover{
transform:scale(1.05);
}

.gender-icon{
font-size:70px;
}

.gender-text{
margin-top:10px;
font-size:22px;
font-weight:bold;
color:white;
}

.selected{
border:3px solid gold;
box-shadow:0 0 25px gold;
}

.status{
margin-top:25px;
color:white;
font-size:18px;
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

<div class="title">
CREATE CHARACTER
</div>

<input
type="text"
id="name"
class="name-box"
maxlength="12"
placeholder="Enter Nickname">

<div class="gender-area">

<div class="gender-card"
id="maleCard"
onclick="selectGender('Male')">

<div class="gender-icon">🧑</div>

<div class="gender-text">
MALE
</div>

</div>

<div class="gender-card"
id="femaleCard"
onclick="selectGender('Female')">

<div class="gender-icon">👩</div>

<div class="gender-text">
FEMALE
</div>

</div>

</div>

<div class="status" id="status">
Choose Name & Gender
</div>

</div>

<script>

let selectedGender=null;

function selectGender(gender){

selectedGender=gender;

document.getElementById("maleCard")
.classList.remove("selected");

document.getElementById("femaleCard")
.classList.remove("selected");

if(gender==="Male"){
document.getElementById("maleCard")
.classList.add("selected");
}else{
document.getElementById("femaleCard")
.classList.add("selected");
}

checkReady();

}

function checkReady(){

let playerName=
document.getElementById("name")
.value.trim();

if(
playerName.length>=3 &&
selectedGender
){

document.getElementById("status")
.innerHTML="Character Created...";

setTimeout(()=>{

let player={

uid:"FXL"+
Math.floor(
10000000+
Math.random()*90000000
),

name:playerName,

gender:selectedGender,

level:1,

coins:1000,

emeralds:0,

hp:200,

ep:100

};

localStorage.setItem(
"player",
JSON.stringify(player)
);

window.location=
"lobby.html";

},1000);

}

}

document
.getElementById("name")
.addEventListener(
"input",
checkReady
);

</script>

</body>
</html>
