<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireX Legends - Profile</title><style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

.header{
    background:#1a1a1a;
    padding:15px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
}

.profile-box{
    width:90%;
    max-width:600px;
    margin:20px auto;
    background:#222;
    border-radius:15px;
    padding:20px;
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#444;
    margin:auto;
}

.name{
    text-align:center;
    font-size:24px;
    margin-top:15px;
}

.uid{
    text-align:center;
    color:#ccc;
    margin-bottom:20px;
}

.stat{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #333;
}

.back-btn{
    display:block;
    width:200px;
    margin:25px auto;
    padding:12px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}
</style></head><body><div class="header">
FIREX LEGENDS PROFILE
</div><div class="profile-box"><div class="avatar"></div><div class="name" id="playerName">
Player
</div><div class="uid" id="playerUID">
UID: Loading...
</div><div class="stat">
<span>Level</span>
<span id="level">1</span>
</div><div class="stat">
<span>Coins</span>
<span id="coins">1000</span>
</div><div class="stat">
<span>Emeralds</span>
<span id="emeralds">0</span>
</div><div class="stat">
<span>Total Kills</span>
<span id="kills">0</span>
</div><div class="stat">
<span>Total Damage</span>
<span id="damage">0</span>
</div><div class="stat">
<span>Likes</span>
<span id="likes">0</span>
</div><div class="stat">
<span>Rank</span>
<span id="rank">Bronze</span>
</div></div><button class="back-btn" onclick="goLobby()">
Back To Lobby
</button><script>

// Name Load
let playerName = localStorage.getItem("playerName");

if(playerName){
    document.getElementById("playerName").innerText = playerName;
}

// UID System
let uid = localStorage.getItem("playerUID");

if(!uid){
    uid = "FX" + Math.floor(100000000 + Math.random()*900000000);
    localStorage.setItem("playerUID",uid);
}

document.getElementById("playerUID").innerText =
"UID: " + uid;

// Back Button
function goLobby(){
    window.location.href="lobby.html";
}

</script></body>
</html>
