<script>

// Player Name
let playerName = localStorage.getItem("playerName");

if(playerName){
    document.getElementById("playerName").innerText = playerName;
}else{
    document.getElementById("playerName").innerText = "Guest Player";
}

// UID System (Permanent)
let uid = localStorage.getItem("playerUID");

if(!uid){
    uid = "FX" + Date.now();
    localStorage.setItem("playerUID", uid);
}

document.getElementById("playerUID").innerText =
"UID: " + uid;

// Default Data
if(!localStorage.getItem("coins")){
    localStorage.setItem("coins","1000");
}

if(!localStorage.getItem("emeralds")){
    localStorage.setItem("emeralds","0");
}

if(!localStorage.getItem("level")){
    localStorage.setItem("level","1");
}

// Load Data
document.getElementById("coins").innerText =
localStorage.getItem("coins");

document.getElementById("emeralds").innerText =
localStorage.getItem("emeralds");

document.getElementById("level").innerText =
localStorage.getItem("level");

// Back Button
function goLobby(){
    window.location.href = "lobby.html";
}

</script>
