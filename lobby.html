<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FireX Legends Lobby</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
width:100vw;
height:100vh;
overflow:hidden;
color:white;

background:url("assets/lobby-bg.png");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.15);
}

/* PROFILE */

.profile{
position:absolute;
top:15px;
left:15px;

width:260px;
height:95px;

background:rgba(0,0,0,0.45);
backdrop-filter:blur(6px);

border-radius:15px;

display:flex;
align-items:center;

padding:10px;
z-index:10;
}

.profile img{
width:70px;
height:70px;
border-radius:10px;
object-fit:cover;
}

.player-info{
margin-left:10px;
}

.player-name{
font-size:22px;
font-weight:bold;
}

.player-uid{
font-size:13px;
opacity:.8;
}

.player-level{
font-size:15px;
margin-top:4px;
}

/* CHARACTER */

.character{
position:absolute;
left:50%;
bottom:60px;
transform:translateX(-50%);
z-index:5;
}

.character img{
height:75vh;
max-height:650px;
}

/* LEFT MENU */

.left-menu{
position:absolute;
right:15px;
top:120px;

display:flex;
flex-direction:column;
gap:12px;

z-index:10;
}

.menu-btn{
width:220px;
height:58px;

background:rgba(0,0,0,0.55);

border-radius:12px;

display:flex;
align-items:center;

padding-left:15px;

font-size:20px;
font-weight:bold;
}

.menu-btn img{
width:34px;
height:34px;
margin-right:12px;
}

/* RIGHT ICONS */

.right-icons{
position:absolute;
left:15px;
bottom:20px;

display:flex;
flex-direction:column;
gap:10px;

z-index:10;
}

.icon-box{
width:70px;
height:70px;

background:rgba(0,0,0,0.55);

border-radius:15px;

display:flex;
justify-content:center;
align-items:center;
}

.icon-box img{
width:42px;
height:42px;
}

/* MAP */

.map-box{
position:absolute;
top:20px;
right:270px;

width:200px;
height:70px;

background:rgba(0,0,0,0.55);

border-radius:15px;

display:flex;
justify-content:center;
align-items:center;

font-size:28px;
font-weight:bold;

z-index:10;
}

/* BOTTOM BAR */

.bottom-bar{
position:absolute;
top:20px;
right:20px;

display:flex;
align-items:center;
gap:20px;

background:rgba(0,0,0,0.55);

padding:12px 20px;

border-radius:15px;

z-index:10;
}

.currency{
font-size:24px;
font-weight:bold;
}

/* START BUTTON */

.start-btn{
position:absolute;
right:20px;
bottom:25px;

width:280px;
height:90px;

border:none;

border-radius:18px;

background:#f2b400;

color:black;

font-size:40px;
font-weight:bold;

cursor:pointer;

z-index:20;
}

.start-btn:hover{
transform:scale(1.03);
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="profile">

<img src="assets/Name.png">

<div class="player-info">

<div class="player-name" id="playerName">
Player
</div>

<div class="player-uid" id="playerUID">
UID
</div>

<div class="player-level">
⭐ Lv. <span id="playerLevel">1</span>
</div>

</div>

</div>

<div class="character">

<img src="assets/rex-rama.png">

</div>

<div class="left-menu">

<div class="menu-btn">
<img src="assets/store.png">
STORE
</div>

<div class="menu-btn">
<img src="assets/luckroyale.png">
LUCK ROYALE
</div>

<div class="menu-btn">
<img src="assets/character.png">
CHARACTER
</div>

<div class="menu-btn">
<img src="assets/vault.png">
VAULT
</div>

<div class="menu-btn">
<img src="assets/pet.png">
PET
</div>

<div class="menu-btn">
<img src="assets/weapon.png">
WEAPON
</div>

<div class="menu-btn">
<img src="assets/collection.png">
COLLECTION
</div>

</div>
</style>
</head>

<body>

<!-- Background -->
<div class="overlay"></div>

<!-- TOP LEFT PROFILE -->
<div class="profile-box" onclick="openProfile()">

<div class="profile-name" id="playerName">
Rex Rama
</div>

<div class="uid" id="playerUID">
UID: FXL000000
</div>

<div class="level">
Lv. <span id="playerLevel">1</span>
</div>

</div>

<!-- TOP CENTER LOGO -->
<div class="logo">
FIREX LEGENDS
</div>

<!-- TOP RIGHT CURRENCY -->
<div class="currency">

<div class="currency-item">
🪙 <span id="coins">1000</span>
</div>

<div class="currency-item">
🟢 <span id="emeralds">0</span>
</div>

</div>

<!-- LEFT SIDE MENU -->
<div class="left-menu">

<div class="menu-btn">
<img src="assets/store.png.jpg">
<span>STORE</span>
</div>

<div class="menu-btn">
<img src="assets/luckroyale.png.jpg">
<span>LUCK ROYALE</span>
</div>

<div class="menu-btn">
<img src="assets/collection.png.jpg">
<span>COLLECTION</span>
</div>

<div class="menu-btn">
<img src="assets/events.png.jpg">
<span>EVENTS</span>
</div>

</div>

<!-- CHARACTER -->
<div class="character">

<img src="assets/1000084836-removebg-preview.png">

</div>

<!-- RIGHT SIDE MENU -->
<div class="right-menu">

<div class="icon-btn">
<img src="assets/mail.png.jpg">
</div>

<div class="icon-btn">
<img src="assets/pet.png.jpg">
</div>

<div class="icon-btn">
<img src="assets/weapon.png.jpg">
</div>

<div class="icon-btn">
<img src="assets/settings.jpg">
</div>

</div>

<!-- MAP SELECT -->
<div class="map-box">

<div class="map-title">
MAP
</div>

<div class="map-name">
F-RANKED
</div>

</div>

<!-- START BUTTON -->
<button class="start-btn">
START
</button>

<script>

let player =
JSON.parse(localStorage.getItem("player"));

if(!player){

player = {

name:"Rex Rama",

uid:"FXL000000",

level:1,

coins:1000,

emeralds:0

};

}

document.getElementById("playerName")
.innerText = player.name;

document.getElementById("playerUID")
.innerText = "UID: " + player.uid;

document.getElementById("playerLevel")
.innerText = player.level;

document.getElementById("coins")
.innerText = player.coins;

document.getElementById("emeralds")
.innerText = player.emeralds;

function openProfile(){

window.location.href =
"profile.html";

}

document.querySelector(".start-btn")
.onclick = function(){

alert("Matchmaking Coming Soon");

};

</script>

</body>
</html>
