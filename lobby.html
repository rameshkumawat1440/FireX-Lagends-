<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FIREX LEGENDS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
}

body{

background:url("assets/file_00000000721071fd8b660d0a7042064c.png");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

color:white;
}

/* Overlay */

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.15);
}

/* Profile */

.profile{

position:absolute;

top:15px;

left:15px;

background:rgba(0,0,0,0.55);

padding:12px 15px;

border-radius:12px;

z-index:10;

min-width:220px;
}

.profileName{

font-size:20px;

font-weight:bold;
}

.profileUID{

font-size:12px;

margin-top:4px;
}

.profileLevel{

font-size:12px;

margin-top:4px;
}

/* Currency */

.currency{

position:absolute;

top:15px;

right:15px;

display:flex;

gap:12px;

z-index:10;
}

.currencyBox{

background:rgba(0,0,0,0.55);

padding:10px 16px;

border-radius:12px;

font-size:18px;

font-weight:bold;
}

/* Character */

.character{

position:absolute;

left:50%;

bottom:0;

transform:translateX(-50%);

height:82%;

z-index:5;
}

.character img{

height:100%;

object-fit:contain;
}

/* Left Icons */

.leftMenu{

position:absolute;

left:20px;

top:50%;

transform:translateY(-50%);

display:flex;

flex-direction:column;

gap:12px;

z-index:10;
}

.leftBtn{

width:70px;

height:70px;

background:rgba(0,0,0,0.55);

border-radius:12px;

display:flex;

align-items:center;

justify-content:center;

font-size:14px;

font-weight:bold;

text-align:center;

cursor:pointer;
}

/* Right Menu */

.rightMenu{

position:absolute;

right:20px;

top:50%;

transform:translateY(-50%);

display:flex;

flex-direction:column;

gap:10px;

z-index:10;
}

.menuBtn{

width:180px;

height:52px;

background:rgba(0,0,0,0.60);

border:none;

border-radius:12px;

color:white;

font-size:15px;

font-weight:bold;

cursor:pointer;
}

/* Bottom Right */

.bottomPanel{

position:absolute;

right:20px;

bottom:20px;

display:flex;

flex-direction:column;

align-items:flex-end;

gap:12px;

z-index:10;
}

.rankBox{

background:rgba(0,0,0,0.60);

padding:12px 20px;

border-radius:12px;

font-weight:bold;

font-size:18px;
}

.startBtn{

width:220px;

height:70px;

border:none;

border-radius:14px;

background:#ffd000;

font-size:28px;

font-weight:bold;

color:black;

cursor:pointer;
}
  /* Responsive */

@media(max-width:900px){

.character{
height:72%;
}

.menuBtn{
width:140px;
font-size:12px;
}

.startBtn{
width:180px;
height:60px;
font-size:22px;
}

.leftBtn{
width:60px;
height:60px;
font-size:12px;
}

}

</style>
</head>

<body>

<div class="overlay"></div>

<!-- PROFILE -->

<div class="profile">

<div id="playerName" class="profileName">
Guest Player
</div>

<div id="playerUID" class="profileUID">
UID : FXL000000
</div>

<div id="playerLevel" class="profileLevel">
Level : 1
</div>

</div>

<!-- CURRENCY -->

<div class="currency">

<div class="currencyBox">
🪙 <span id="coins">1000</span>
</div>

<div class="currencyBox">
🟢 <span id="emeralds">0</span>
</div>

</div>

<!-- LEFT SIDE -->

<div class="leftMenu">

<div class="leftBtn">
EVENTS
</div>

<div class="leftBtn">
MAIL
</div>

<div class="leftBtn">
REWARD
</div>

<div class="leftBtn">
SETTINGS
</div>

</div>

<!-- CHARACTER -->

<div class="character">

<img
src="assets/1000084836-removebg-preview.png"
alt="Character">

</div>

<!-- RIGHT MENU -->

<div class="rightMenu">

<button class="menuBtn">
STORE
</button>

<button class="menuBtn">
LUCK ROYALE
</button>

<button class="menuBtn">
CHARACTER
</button>

<button class="menuBtn">
VAULT
</button>

<button class="menuBtn">
PET
</button>

<button class="menuBtn">
WEAPON
</button>

<button class="menuBtn">
COLLECTION
</button>

</div>

<!-- START PANEL -->

<div class="bottomPanel">

<div class="rankBox">
F-RANKED
</div>

<button class="startBtn">
START
</button>

</div>

<script>

let player =
JSON.parse(
localStorage.getItem("player")
);

if(!player){

player = {

name:"REX RAMA",

uid:"FXL000000",

level:1,

coins:1000,

emeralds:0

};

}

document.getElementById(
"playerName"
).innerText =
player.name || "REX RAMA";

document.getElementById(
"playerUID"
).innerText =
"UID : " + player.uid;

document.getElementById(
"playerLevel"
).innerText =
"Level : " + player.level;

document.getElementById(
"coins"
).innerText =
player.coins || 1000;

document.getElementById(
"emeralds"
).innerText =
player.emeralds || 0;

document.querySelector(
".startBtn"
).onclick = function(){

alert(
"Matchmaking Coming Soon"
);

};

</script>

</body>
</html>
