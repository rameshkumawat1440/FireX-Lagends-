<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FIREX LEGENDS Lobby</title><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
width:100vw;
height:100vh;
overflow:hidden;

background:url("assets/file_00000000721071fd8b660d0a7042064c.png");
background-size:cover;
background-position:center;
background-repeat:no-repeat;

color:white;
}

/* DARK OVERLAY */

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.25);
}

/* PROFILE */

.profile{
position:absolute;
top:15px;
left:15px;

background:rgba(0,0,0,.55);

padding:12px 18px;

border-radius:12px;

z-index:10;

min-width:220px;
}

.profileName{
font-size:22px;
font-weight:bold;
}

.profileUID{
font-size:13px;
margin-top:3px;
}

.profileLevel{
font-size:13px;
margin-top:3px;
}

/* TOP RIGHT */

.rankPanel{
position:absolute;
top:15px;
right:15px;

display:flex;
align-items:center;

gap:12px;

z-index:10;
}

.rankMode{
background:rgba(0,0,0,.65);

padding:12px 20px;

border-radius:12px;

font-weight:bold;

font-size:18px;
}

.startBtn{

width:220px;
height:65px;

border:none;

border-radius:12px;

background:#ffd000;

color:black;

font-size:26px;

font-weight:bold;

cursor:pointer;
}

/* LEFT SIDE */

.leftMenu{

position:absolute;

left:15px;

top:50%;

transform:translateY(-50%);

display:flex;

flex-direction:column;

gap:12px;

z-index:10;
}

.leftItem{

width:70px;
height:70px;

background:rgba(0,0,0,.55);

border-radius:12px;

display:flex;

align-items:center;

justify-content:center;

font-size:30px;

cursor:pointer;
}

/* RIGHT SIDE */

.rightMenu{

position:absolute;

right:15px;

top:50%;

transform:translateY(-50%);

display:flex;

flex-direction:column;

gap:10px;

z-index:10;
}

.menuBtn{

width:190px;

height:52px;

border:none;

border-radius:10px;

background:rgba(0,0,0,.65);

color:white;

font-weight:bold;

cursor:pointer;
}

/* CHARACTER */

.hero{

position:absolute;

left:50%;

bottom:25px;

transform:translateX(-50%);

height:78%;

z-index:5;
}

.hero img{

height:100%;

object-fit:contain;
}

/* BOTTOM RIGHT */

.currency{

position:absolute;

right:15px;

bottom:15px;

background:rgba(0,0,0,.65);

padding:12px 18px;

border-radius:12px;

font-size:18px;

z-index:10;
}

/* MOBILE */

@media(max-width:900px){

.hero{
height:68%;
}

.menuBtn{
width:150px;
font-size:12px;
}

.startBtn{
width:160px;
height:55px;
font-size:20px;
}

.rankMode{
font-size:14px;
}

}

</style>
</head><body><div class="overlay"></div><!-- PROFILE --><div class="profile"><div id="playerName" class="profileName">
Guest Player
</div><div id="playerUID" class="profileUID">
UID: FXL000000
</div><div id="playerLevel" class="profileLevel">
Level: 1
</div></div><!-- TOP RIGHT --><div class="rankPanel"><div class="rankMode">
F-RANKED
</div><button class="startBtn">
START
</button></div><!-- LEFT MENU --><div class="leftMenu"><div class="leftItem">🎁</div><div class="leftItem">🏆</div><div class="leftItem">📨</div><div class="leftItem">⚙️</div></div><!-- RIGHT MENU --><div class="rightMenu"><button class="menuBtn">
STORE
</button><button class="menuBtn">
LUCK ROYALE
</button><button class="menuBtn">
CHARACTER
</button><button class="menuBtn">
VAULT
</button><button class="menuBtn">
PET
</button><button class="menuBtn">
WEAPON
</button><button class="menuBtn">
COLLECTION
</button></div><!-- CHARACTER --><div class="hero"><img
src="assets/1000084836-removebg-preview.png">

</div><!-- CURRENCY --><div class="currency">🪙 <span id="coins">
1000
</span>

  

🟢 <span id="emeralds">
0
</span>

</div><script>

let player =
JSON.parse(
localStorage.getItem("player")
);

if(!player){

player = {

name:"Guest Player",

uid:"FXL000000",

level:1,

coins:1000,

emeralds:0

};

}

document.getElementById(
"playerName"
).innerText =
player.name;

document.getElementById(
"playerUID"
).innerText =
"UID: " + player.uid;

document.getElementById(
"playerLevel"
).innerText =
"Level: " + player.level;

document.getElementById(
"coins"
).innerText =
player.coins;

document.getElementById(
"emeralds"
).innerText =
player.emeralds;

</script></body>
</html>
