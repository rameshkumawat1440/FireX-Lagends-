<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FIREX LEGENDS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
width:100vw;
height:100vh;
overflow:hidden;

background:url("assets/loading-bg.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
}

.logo{

position:absolute;

top:12%;

width:100%;

text-align:center;

font-size:55px;

font-weight:bold;

color:white;

text-shadow:
0 0 10px red,
0 0 25px red;
}

.tagline{

position:absolute;

top:23%;

width:100%;

text-align:center;

color:white;

letter-spacing:4px;

font-size:14px;
}

.loading-container{

position:absolute;

bottom:80px;

width:100%;

text-align:center;

}

.loading-bar{

width:70%;

height:12px;

margin:auto;

background:rgba(255,255,255,0.2);

border-radius:50px;

overflow:hidden;

}

.progress{

width:0%;

height:100%;

background:linear-gradient(
90deg,
#ff8c00,
#ffd700
);

box-shadow:
0 0 15px gold,
0 0 25px orange;

}

.percent{

margin-top:15px;

color:white;

font-size:22px;

font-weight:bold;
}

.loading-text{

margin-top:10px;

color:white;

letter-spacing:3px;

font-size:13px;
}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="logo">
FIREX LEGENDS
</div>

<div class="tagline">
SURVIVE • FIGHT • LEGEND
</div>

<div class="loading-container">

<div class="loading-bar">

<div id="progress" class="progress"></div>

</div>

<div id="percent" class="percent">
0%
</div>

<div class="loading-text">
LOADING RESOURCES...
</div>

</div>

<script>

let progress=0;

const bar=document.getElementById("progress");

const percent=document.getElementById("percent");

const loading=setInterval(()=>{

progress++;

bar.style.width=progress+"%";

percent.innerHTML=progress+"%";

if(progress>=100){

clearInterval(loading);

/* next page */

window.location.href="login.html";

}

},50);

</script>

</body>
</html>
