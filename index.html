<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FIREX LEGENDS</title><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
}

/* Background */

body{
background:url("assets/file_00000000e20471f5af2be8aaea85acb0.png");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

/* Rotate Message */

#rotateMessage{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#000;
color:#fff;
font-size:28px;
font-weight:bold;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
z-index:99999;
}

/* Portrait Mode */

@media (orientation: portrait){

#rotateMessage{
display:flex;
}

#gameScreen{
display:none;
}

}

/* Landscape Mode */

#gameScreen{
position:relative;
width:100%;
height:100%;
}

/* Dark Overlay */

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
}

/* Logo */

.logo{
position:absolute;
top:8%;
left:50%;
transform:translateX(-50%);
color:white;
font-size:clamp(36px,5vw,72px);
font-weight:bold;
text-shadow:
0 0 10px red,
0 0 25px red;
z-index:2;
}

/* Tagline */

.tagline{
position:absolute;
top:20%;
left:50%;
transform:translateX(-50%);
color:white;
letter-spacing:4px;
font-size:clamp(10px,1.2vw,18px);
z-index:2;
}

/* Loading Area */

.loading-container{
position:absolute;
bottom:40px;
width:100%;
z-index:2;
}

.loading-wrapper{
width:70%;
margin:auto;
display:flex;
align-items:center;
gap:15px;
}

.loading-bar{
flex:1;
height:10px;
background:rgba(255,255,255,0.25);
border-radius:50px;
overflow:hidden;
}

.progress{
width:0%;
height:100%;
background:linear-gradient(
90deg,
#ff8c00,
#ffd700
);
box-shadow:
0 0 15px gold,
0 0 25px orange;
}

.percent{
color:white;
font-size:20px;
font-weight:bold;
min-width:55px;
}

.loading-text{
margin-top:12px;
text-align:center;
color:white;
font-size:12px;
letter-spacing:3px;
}

</style></head><body><div id="rotateMessage">
ROTATE DEVICE TO PLAY FIREX LEGENDS
</div><div id="gameScreen"><div class="overlay"></div><div class="logo">
FIREX LEGENDS
</div><div class="tagline">
SURVIVE • FIGHT • LEGEND
</div><div class="loading-container"><div class="loading-wrapper"><div class="loading-bar">
<div id="progress" class="progress"></div>
</div><div id="percent" class="percent">
0%
</div></div><div class="loading-text">
LOADING RESOURCES... PLEASE WAIT
</div></div></div><script>

let progress = 0;

const bar = document.getElementById("progress");
const percent = document.getElementById("percent");

const loading = setInterval(()=>{

progress++;

bar.style.width = progress + "%";
percent.innerHTML = progress + "%";

if(progress >= 100){

clearInterval(loading);

window.location.href = "login.html";

}

},50);

</script></body>
</html>
