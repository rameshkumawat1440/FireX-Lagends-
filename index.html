<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireX Legends</title><style>

#rotateMessage{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    color:white;
    font-size:30px;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:9999;
}

@media screen and (orientation: portrait){

    #rotateMessage{
        display:flex;
    }

    body > *:not(#rotateMessage){
        display:none;
    }

}

body{
margin:0;
background:black;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
flex-direction:column;
}

.bar{
width:300px;
height:20px;
border:1px solid white;
}

.fill{
height:100%;
width:0%;
background:lime;
animation:load 5s linear forwards;
}

@keyframes load{
from{width:0%;}
to{width:100%;}
}

</style></head><body><div id="rotateMessage">
Please rotate your device to Landscape Mode
</div><h1>FIREX LEGENDS</h1><div class="bar">
<div class="fill"></div>
</div><p>Loading...</p><script>
setTimeout(()=>{
window.location="login.html";
},5000);
</script></body>
</html>
