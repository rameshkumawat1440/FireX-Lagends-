<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FIREX LEGENDS</title><style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
}

/* Background */

body{
background:url("assets/file_00000000e20471f5af2be8aaea85acb0.png");
background-size:cover;
background-position:center center;
background-repeat:no-repeat;
}

/* Dark Overlay */

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.15);
}

/* Loading Area */

.loading-container{
position:absolute;
bottom:35px;
left:0;
width:100%;
z-index:10;
}

.loading-wrapper{
width:70%;
margin:auto;
display:flex;
align-items:center;
gap:15px;
}

.loading-bar{
flex:1;
height:10px;
background:rgba(255,255,255,0.25);
border-radius:50px;
overflow:hidden;
}

.progress{
width:0%;
height:100%;
background:linear-gradient(
90deg,
#ff9a00,
#ffd700
);
box-shadow:
0 0 10px #ffd700,
0 0 20px #ff9a00;
}

.percent{
color:white;
font-size:22px;
font-weight:bold;
min-width:60px;
text-shadow:0 0 8px rgba(0,0,0,0.8);
}

.loading-text{
margin-top:12px;
text-align:center;
color:white;
font-size:11px;
letter-spacing:4px;
text-shadow:0 0 8px rgba(0,0,0,0.8);
}

</style></head><body><div class="overlay"></div><div class="loading-container"><div class="loading-wrapper"><div class="loading-bar">
<div id="progress" class="progress"></div>
</div><div id="percent" class="percent">
0%
</div></div><div class="loading-text">
LOADING RESOURCES... PLEASE WAIT
</div></div><script>

let progress = 0;

const bar = document.getElementById("progress");
const percent = document.getElementById("percent");

const loading = setInterval(()=>{

progress++;

bar.style.width = progress + "%";
percent.innerHTML = progress + "%";

if(progress >= 100){

clearInterval(loading);

window.location.href = "login.html";

}

},50);

</script></body>
</html>
